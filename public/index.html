<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VoiceBook — AI Scheduling</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #6ee7b7;
      --accent2: #818cf8;
      --accent3: #f472b6;
      --text: #e2e8f0;
      --muted: #64748b;
      --success: #34d399;
      --warning: #fbbf24;
      --error: #f87171;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(circle at 20% 20%, rgba(110,231,183,0.03), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(129,140,248,0.03), transparent 30%);
      animation: pulseBg 10s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes pulseBg {
      from {
        transform: scale(1) rotate(0deg);
      }
      to {
        transform: scale(1.05) rotate(4deg);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1300px;
      margin: auto;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-text {
      font-size: 34px;
      font-weight: 700;
    }

    .logo-text span {
      color: var(--accent);
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%,100% {
        opacity: 1;
      }
      50% {
        opacity: 0.4;
      }
    }

    .setup-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 22px;
    }

    .setup-title {
      font-size: 15px;
      color: var(--accent2);
      margin-bottom: 16px;
      font-weight: 600;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      outline: none;
      font-size: 13px;
      font-family: 'DM Mono', monospace;
    }

    input[type="text"]:focus {
      border-color: var(--accent2);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #000;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .btn-secondary {
      background: var(--border);
      color: white;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 22px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 40px;
      font-family: 'DM Mono', monospace;
      font-weight: 700;
    }

    .green { color: var(--accent); }
    .purple { color: var(--accent2); }
    .yellow { color: var(--warning); }
    .pink { color: var(--accent3); }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    .card-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background: rgba(110,231,183,0.1);
      color: var(--accent);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--success);
      font-size: 12px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 1.5s infinite;
    }

    .activity-list,
    .bookings-list {
      padding: 12px;
      max-height: 650px;
      overflow-y: auto;
    }

    .activity-item,
    .booking-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .activity-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .activity-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    .booking {
      background: rgba(110,231,183,0.1);
    }

    .check {
      background: rgba(129,140,248,0.1);
    }

    .call {
      background: rgba(244,114,182,0.1);
    }

    .activity-content {
      flex: 1;
    }

    .activity-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .activity-meta,
    .activity-time,
    .booking-details {
      font-size: 12px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .booking-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .booking-name {
      font-size: 14px;
      font-weight: 600;
    }

    .booking-status {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(110,231,183,0.1);
      color: var(--accent);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      min-width: 320px;
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      animation: toastIn 0.25s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .toast.success {
      border-left: 4px solid var(--success);
    }

    .toast.info {
      border-left: 4px solid var(--accent2);
    }

    .toast-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .toast-body {
      font-size: 13px;
      color: var(--muted);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @media(max-width: 900px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .main-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="toast-container" id="toastContainer"></div>

<div class="container">

  <header>
    <div class="logo">
      <div class="logo-icon">📅</div>
      <div class="logo-text">Voice<span>Book</span></div>
    </div>

    <div class="status-bar">
      <div class="status-dot"></div>
      <span>Real-time • Socket.IO</span>
    </div>
  </header>

  <div class="setup-panel">
    <div class="setup-title">
      ⚡ VAPI Setup — Connect your ngrok URL
    </div>

    <div class="input-group">
      <input
        type="text"
        id="ngrokUrl"
        placeholder="https://xxxx.ngrok-free.app"
      />

      <button onclick="setupVapi()">
        Connect VAPI
      </button>

      <button class="btn-secondary" onclick="loadBookings()">
        Refresh
      </button>
    </div>

    <div
      id="setupStatus"
      style="font-size:12px; color: var(--muted); font-family:'DM Mono', monospace;"
    ></div>
  </div>

  <div class="stats-grid">

    <div class="stat-card">
      <div class="stat-label">Total Bookings</div>
      <div class="stat-value green" id="totalBookings">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Availability Checks</div>
      <div class="stat-value yellow" id="availChecks">0</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Live Events</div>
      <div class="stat-value pink" id="liveEvents">0</div>
    </div>

  </div>

  <div class="main-grid">

    <div class="card">

      <div class="card-header">
        <div class="card-title">
          🔴 Live Activity

          <div class="live-badge">
            <div class="live-dot"></div>
            LIVE
          </div>
        </div>

        <span class="badge" id="activityCount">
          0 events
        </span>
      </div>

      <div class="activity-list" id="activityList">

        <div class="empty-state">
          <div class="empty-icon">🎙️</div>

          <div>
            Waiting for voice calls...<br/>
            Events will appear here in real-time
          </div>
        </div>

      </div>

    </div>

    <div>

      <div class="card">

        <div class="card-header">
          <div class="card-title">
            📆 Upcoming Bookings
          </div>

          <span class="badge" id="bookingCount">
            0
          </span>
        </div>

        <div class="bookings-list" id="bookingsList">

          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div>No bookings yet</div>
          </div>

        </div>

      </div>

    </div>

  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
  const socket = io();

  let activityCount = 0;
  let availChecks = 0;
  let liveEvents = 0;

  socket.on("connect", () => {
    console.log("Socket connected");

    showToast(
      "success",
      "Connected",
      "Realtime dashboard connected"
    );

    loadBookings();
  });

  socket.on("disconnect", () => {
    console.log("Socket disconnected");

    showToast(
      "info",
      "Connection Lost",
      "Realtime dashboard disconnected"
    );
  });

  socket.on("reconnect", () => {
    console.log("Socket reconnected");

    showToast(
      "success",
      "Reconnected",
      "Realtime dashboard connected again"
    );

    loadBookings();
  });

  socket.on("booking_created", (data) => {
    liveEvents++;

    document.getElementById("liveEvents").textContent = liveEvents;

    addActivity({
      icon: "✅",
      iconClass: "booking",
      title: `Booking Confirmed — ${data.customerName}`,
      meta: `${data.date} at ${data.time} • ${data.purpose}`,
      time: formatTime(data.timestamp),
    });

    showToast(
      "success",
      "New Booking!",
      `${data.customerName} booked for ${data.date} at ${data.time}`
    );

    loadBookings();
  });

  socket.on("reservation_cancelled", (data) => {
    liveEvents++;

    document.getElementById("liveEvents").textContent = liveEvents;

    addActivity({
      icon: "❌",
      iconClass: "call",
      title: `Reservation Cancelled — ${data.customerName}`,
      meta: `${data.date}`,
      time: formatTime(data.timestamp),
    });

    showToast(
      "info",
      "Reservation Cancelled",
      `${data.customerName}'s reservation was cancelled`
    );

    loadBookings();
  });

  socket.on("reservation_rescheduled", (data) => {
    liveEvents++;

    document.getElementById("liveEvents").textContent = liveEvents;

    addActivity({
      icon: "🔄",
      iconClass: "check",
      title: `Reservation Rescheduled — ${data.customerName}`,
      meta: `${data.oldDate} → ${data.newDate} at ${data.newTime}`,
      time: formatTime(data.timestamp),
    });

    showToast(
      "success",
      "Reservation Rescheduled",
      `${data.customerName} moved reservation to ${data.newDate} at ${data.newTime}`
    );

    loadBookings();
  });

  socket.on("availability_checked", (data) => {
    availChecks++;
    liveEvents++;

    document.getElementById("availChecks").textContent = availChecks;
    document.getElementById("liveEvents").textContent = liveEvents;

    addActivity({
      icon: data.available ? "🟢" : "🔴",
      iconClass: "check",
      title: `Availability Check — ${data.available ? "Available" : "Unavailable"}`,
      meta: `${data.date} at ${data.time}`,
      time: formatTime(data.timestamp),
    });
  });

  function addActivity(item) {
    activityCount++;

    document.getElementById("activityCount").textContent =
      `${activityCount} events`;

    const list = document.getElementById("activityList");

    const empty = list.querySelector(".empty-state");

    if (empty) {
      empty.remove();
    }

    const el = document.createElement("div");

    el.className = "activity-item";

    el.innerHTML = `
      <div class="activity-icon ${item.iconClass}">
        ${item.icon}
      </div>

      <div class="activity-content">
        <div class="activity-title">
          ${item.title}
        </div>

        <div class="activity-meta">
          ${item.meta}
        </div>
      </div>

      <div class="activity-time">
        ${item.time}
      </div>
    `;

    list.prepend(el);
  }

  async function loadBookings() {
    try {
      const res = await fetch("/api/bookings");

      const data = await res.json();

      const bookings = data.bookings || [];

      document.getElementById("totalBookings").textContent =
        bookings.length;

      document.getElementById("bookingCount").textContent =
        bookings.length;

      const list = document.getElementById("bookingsList");

      if (!bookings.length) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <div>No upcoming bookings</div>
          </div>
        `;

        return;
      }

      list.innerHTML = bookings.map((b) => {

        const start = new Date(
          b.start?.dateTime || b.start?.date
        );

        return `
          <div class="booking-item">

            <div class="booking-header">
              <div class="booking-name">
                ${b.summary || "Booking"}
              </div>

              <div class="booking-status">
                Confirmed
              </div>
            </div>

            <div class="booking-details">
              ${start.toLocaleDateString("en-US", {
                weekday: "short",
                month: "short",
                day: "numeric",
                year: "numeric",
              })}

              ·

              ${start.toLocaleTimeString("en-US", {
                hour: "numeric",
                minute: "2-digit",
              })}
            </div>

          </div>
        `;
      }).join("");

    } catch (err) {
      console.error("Failed to load bookings", err);

      showToast(
        "info",
        "Booking Load Failed",
        "Could not refresh upcoming bookings"
      );
    }
  }

  async function setupVapi() {
    const ngrokUrl =
      document.getElementById("ngrokUrl").value.trim();

    if (!ngrokUrl) {
      document.getElementById("setupStatus").textContent =
        "❌ Please enter ngrok URL";

      return;
    }

    if (
      !ngrokUrl.startsWith("https://") ||
      !ngrokUrl.includes("ngrok")
    ) {
      document.getElementById("setupStatus").textContent =
        "❌ Please enter a valid ngrok URL";

      return;
    }

    document.getElementById("setupStatus").textContent =
      "⏳ Setting up VAPI assistant...";

    try {
      const res = await fetch("/api/setup-vapi", {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
        },

        body: JSON.stringify({ ngrokUrl }),
      });

      const data = await res.json();

      if (data.success) {
        document.getElementById("setupStatus").textContent =
          `✅ VAPI Assistant created: ${data.assistant.name} (ID: ${data.assistant.id})`;

        showToast(
          "success",
          "VAPI Connected!",
          "Assistant ready for calls"
        );
      } else {
        document.getElementById("setupStatus").textContent =
          "❌ Failed to setup VAPI";
      }

    } catch (err) {
      document.getElementById("setupStatus").textContent =
        "❌ Failed to setup VAPI";

      showToast(
        "info",
        "Setup Failed",
        "Could not connect VAPI assistant"
      );
    }
  }

  function showToast(type, title, body) {
    const container =
      document.getElementById("toastContainer");

    const toast = document.createElement("div");

    toast.className = `toast ${type}`;

    toast.innerHTML = `
      <div class="toast-title">
        ${title}
      </div>

      <div class="toast-body">
        ${body}
      </div>
    `;

    container.appendChild(toast);

    setTimeout(() => {
      toast.remove();
    }, 4000);
  }

  function formatTime(timestamp) {
    return new Date(timestamp).toLocaleTimeString(
      "en-US",
      {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
      }
    );
  }
</script>

</body>
</html>
